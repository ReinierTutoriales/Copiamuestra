name: Legacy byte-safe source correction

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/legacy-byte-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Patch worker shutdown without transcoding source
        shell: pwsh
        run: |
          $path = 'ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp'
          $bytes = [IO.File]::ReadAllBytes($path)
          $ascii = [Text.Encoding]::ASCII
          $old = $ascii.GetBytes("::WaitForSingleObject(m_hThread,3*1000) ;")
          $new = $ascii.GetBytes("::WaitForSingleObject(m_hThread,INFINITE) ;")

          function Find-All([byte[]]$haystack,[byte[]]$needle) {
            $hits = @()
            for ($i=0; $i -le $haystack.Length-$needle.Length; $i++) {
              $match=$true
              for ($j=0; $j -lt $needle.Length; $j++) {
                if ($haystack[$i+$j] -ne $needle[$j]) { $match=$false; break }
              }
              if ($match) { $hits += $i; $i += $needle.Length-1 }
            }
            return $hits
          }

          function Replace-At([byte[]]$src,[int]$pos,[byte[]]$old,[byte[]]$new) {
            $dst = New-Object byte[] ($src.Length-$old.Length+$new.Length)
            [Array]::Copy($src,0,$dst,0,$pos)
            [Array]::Copy($new,0,$dst,$pos,$new.Length)
            [Array]::Copy($src,$pos+$old.Length,$dst,$pos+$new.Length,$src.Length-$pos-$old.Length)
            return $dst
          }

          $hits = @(Find-All $bytes $old)
          if ($hits.Count -ne 2) { throw "Expected two legacy waits, found $($hits.Count)" }
          for ($i=$hits.Count-1; $i -ge 0; $i--) { $bytes = Replace-At $bytes $hits[$i] $old $new }
          [IO.File]::WriteAllBytes($path,$bytes)

          # Closing synchronization events before the worker exits is the real UAF race.
          # Move those CloseHandle operations out of the live-thread block using exact ASCII replacements.
          $text = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes($path))
          $oldBlock = @'
		::SetEvent(m_hWriteDataReadyEvent) ;
		::CloseHandle(m_hWriteDataReadyEvent) ;
		m_hWriteDataReadyEvent = NULL ;

		if(m_hWaitForFileBufNotFull!=NULL)
		{
			::SetEvent(m_hWaitForFileBufNotFull) ;
			::CloseHandle(m_hWaitForFileBufNotFull) ;
			m_hWaitForFileBufNotFull = NULL ;
		}

		if(m_hLinkEndForQueEmpty!=NULL)
		{
			::SetEvent(m_hLinkEndForQueEmpty) ;
			::CloseHandle(m_hLinkEndForQueEmpty) ;
			m_hLinkEndForQueEmpty = NULL ;
		}
'@
          $newBlock = @'
		if(m_hWriteDataReadyEvent!=NULL)
			::SetEvent(m_hWriteDataReadyEvent) ;
		if(m_hWaitForFileBufNotFull!=NULL)
			::SetEvent(m_hWaitForFileBufNotFull) ;
		if(m_hLinkEndForQueEmpty!=NULL)
			::SetEvent(m_hLinkEndForQueEmpty) ;
'@
          $count = ([regex]::Matches($text,[regex]::Escape($oldBlock))).Count
          if ($count -ne 2) { throw "Expected two event-close blocks, found $count" }
          $text = $text.Replace($oldBlock,$newBlock)

          $threadTail = @'
		::CloseHandle(m_hThread) ;
		m_hThread = NULL ;
	}
'@
          $safeTail = @'
		::CloseHandle(m_hThread) ;
		m_hThread = NULL ;
	}

	if(m_hWriteDataReadyEvent!=NULL)
	{
		::CloseHandle(m_hWriteDataReadyEvent) ;
		m_hWriteDataReadyEvent = NULL ;
	}
	if(m_hWaitForFileBufNotFull!=NULL)
	{
		::CloseHandle(m_hWaitForFileBufNotFull) ;
		m_hWaitForFileBufNotFull = NULL ;
	}
	if(m_hLinkEndForQueEmpty!=NULL)
	{
		::CloseHandle(m_hLinkEndForQueEmpty) ;
		m_hLinkEndForQueEmpty = NULL ;
	}
'@
          $count2 = ([regex]::Matches($text,[regex]::Escape($threadTail))).Count
          if ($count2 -ne 2) { throw "Expected two thread tails, found $count2" }
          $text = $text.Replace($threadTail,$safeTail)
          [IO.File]::WriteAllBytes($path,[Text.Encoding]::GetEncoding(28591).GetBytes($text))

          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) { throw "Unexpected changed files: $changed" }
          git diff -- $path

      - name: Build patched x64 Release
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal
          $exe = 'ExtremeCopy/App/Build/Release/ExtremeCopy.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }

      - name: Commit validated source correction
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp
          git diff --cached --quiet && throw 'Expected source correction was not staged.'
          git commit -m 'fix: keep async worker events alive until thread exit'
          git push origin HEAD:main
