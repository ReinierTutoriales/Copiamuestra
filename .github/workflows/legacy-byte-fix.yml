name: Legacy byte-safe source correction

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/legacy-byte-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Apply byte-preserving copy correctness corrections
        shell: pwsh
        run: |
          # Retrigger 2026-09-15: COPY correctness pass.
          function Replace-AsciiExact([string]$path, [string]$oldText, [string]$newText, [int]$expected = 1) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $old = [System.Text.Encoding]::ASCII.GetBytes($oldText)
            $new = [System.Text.Encoding]::ASCII.GetBytes($newText)
            $matches = @()
            for ($i = 0; $i -le $bytes.Length - $old.Length; $i++) {
              $ok = $true
              for ($j = 0; $j -lt $old.Length; $j++) {
                if ($bytes[$i + $j] -ne $old[$j]) { $ok = $false; break }
              }
              if ($ok) { $matches += $i; $i += $old.Length - 1 }
            }
            if ($matches.Count -ne $expected) { throw "${path}: expected $expected matches, found $($matches.Count)" }
            for ($m = $matches.Count - 1; $m -ge 0; $m--) {
              $pos = $matches[$m]
              $out = New-Object byte[] ($bytes.Length - $old.Length + $new.Length)
              [Array]::Copy($bytes, 0, $out, 0, $pos)
              [Array]::Copy($new, 0, $out, $pos, $new.Length)
              $tailSrc = $pos + $old.Length
              $tailDst = $pos + $new.Length
              [Array]::Copy($bytes, $tailSrc, $out, $tailDst, $bytes.Length - $tailSrc)
              $bytes = $out
            }
            [System.IO.File]::WriteAllBytes($path, $bytes)
          }

          $async = 'ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp'
          $oldShutdown = @'
	if(m_hThread!=NULL)
	{
		::SetEvent(m_hWriteDataReadyEvent) ;
		::CloseHandle(m_hWriteDataReadyEvent) ;
		m_hWriteDataReadyEvent = NULL ;

		if(m_hWaitForFileBufNotFull!=NULL)
		{
			::SetEvent(m_hWaitForFileBufNotFull) ;
			::CloseHandle(m_hWaitForFileBufNotFull) ;
			m_hWaitForFileBufNotFull = NULL ;
		}

		if(m_hLinkEndForQueEmpty!=NULL)
		{
			::SetEvent(m_hLinkEndForQueEmpty) ;
			::CloseHandle(m_hLinkEndForQueEmpty) ;
			m_hLinkEndForQueEmpty = NULL ;
		}

		::WaitForSingleObject(m_hThread,3*1000) ;
		::CloseHandle(m_hThread) ;
		m_hThread = NULL ;
	}
'@
          $newShutdown = @'
	if(m_hThread!=NULL)
	{
		if(m_hWriteDataReadyEvent!=NULL)
			::SetEvent(m_hWriteDataReadyEvent) ;
		if(m_hWaitForFileBufNotFull!=NULL)
			::SetEvent(m_hWaitForFileBufNotFull) ;
		if(m_hLinkEndForQueEmpty!=NULL)
			::SetEvent(m_hLinkEndForQueEmpty) ;

		::WaitForSingleObject(m_hThread,INFINITE) ;
		::CloseHandle(m_hThread) ;
		m_hThread = NULL ;
	}

	if(m_hWriteDataReadyEvent!=NULL)
	{
		::CloseHandle(m_hWriteDataReadyEvent) ;
		m_hWriteDataReadyEvent = NULL ;
	}
	if(m_hWaitForFileBufNotFull!=NULL)
	{
		::CloseHandle(m_hWaitForFileBufNotFull) ;
		m_hWaitForFileBufNotFull = NULL ;
	}
	if(m_hLinkEndForQueEmpty!=NULL)
	{
		::CloseHandle(m_hLinkEndForQueEmpty) ;
		m_hLinkEndForQueEmpty = NULL ;
	}
'@
          Replace-AsciiExact $async $oldShutdown $newShutdown 2

          $dest = 'ExtremeCopy/Core/XCLocalFileSyncDestnationFilter.cpp'
          Replace-AsciiExact $dest 'if(b)' 'if(b && dwWrite==(DWORD)nSize)' 1
          Replace-AsciiExact $dest @'
		else
		{
			Debug_Printf(_T("CXCLocalFileDestnationFilter::WriteFileData() failed")) ;
'@ @'
		else
		{
			if(b && dwWrite!=(DWORD)nSize)
				::SetLastError(ERROR_WRITE_FAULT) ;
			Debug_Printf(_T("CXCLocalFileDestnationFilter::WriteFileData() failed")) ;
'@ 1

          git diff --check
          $changed = @(git diff --name-only)
          $expectedFiles = @($async, $dest)
          if (@($changed | Where-Object { $_ -notin $expectedFiles }).Count -ne 0) { throw "Unexpected changed files: $changed" }
          git diff --stat
          git diff -- $async $dest

      - name: Build patched x64 Release before commit
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal
          $exe = 'ExtremeCopy/App/Build/Release/ExtremeCopy.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }

      - name: Commit validated copy correctness corrections
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp ExtremeCopy/Core/XCLocalFileSyncDestnationFilter.cpp
          git diff --cached --quiet && throw 'Expected copy correctness corrections were not staged.'
          git commit -m 'fix: harden copy write and worker shutdown correctness'
          git push origin HEAD:main
