name: Legacy byte-safe source correction

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/legacy-byte-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Apply byte-preserving x64 corrections
        shell: pwsh
        run: |
          function Replace-AsciiExact([string]$path, [string]$oldText, [string]$newText, [int]$expected = 1) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $old = [System.Text.Encoding]::ASCII.GetBytes($oldText)
            $new = [System.Text.Encoding]::ASCII.GetBytes($newText)
            $matches = @()
            for ($i = 0; $i -le $bytes.Length - $old.Length; $i++) {
              $ok = $true
              for ($j = 0; $j -lt $old.Length; $j++) {
                if ($bytes[$i + $j] -ne $old[$j]) { $ok = $false; break }
              }
              if ($ok) { $matches += $i; $i += $old.Length - 1 }
            }
            if ($matches.Count -ne $expected) { throw "${path}: expected $expected matches for [$oldText], found $($matches.Count)" }
            for ($m = $matches.Count - 1; $m -ge 0; $m--) {
              $pos = $matches[$m]
              $out = New-Object byte[] ($bytes.Length - $old.Length + $new.Length)
              [Array]::Copy($bytes, 0, $out, 0, $pos)
              [Array]::Copy($new, 0, $out, $pos, $new.Length)
              $tailSrc = $pos + $old.Length
              $tailDst = $pos + $new.Length
              [Array]::Copy($bytes, $tailSrc, $out, $tailDst, $bytes.Length - $tailSrc)
              $bytes = $out
            }
            [System.IO.File]::WriteAllBytes($path, $bytes)
          }

          Replace-AsciiExact 'ExtremeCopy/Common/WndShadow.h' 'LONG m_OriParentProc;' 'LONG_PTR m_OriParentProc;'
          Replace-AsciiExact 'ExtremeCopy/Common/WndShadow.cpp' 'm_OriParentProc = GetWindowLong(hParentWnd, GWLP_WNDPROC);' 'm_OriParentProc = GetWindowLongPtr(hParentWnd, GWLP_WNDPROC);'
          Replace-AsciiExact 'ExtremeCopy/Common/WndShadow.cpp' 'SetWindowLong(hParentWnd, GWLP_WNDPROC, (LONG)ParentProc);' 'SetWindowLongPtr(hParentWnd, GWLP_WNDPROC, reinterpret_cast<LONG_PTR>(ParentProc));'
          Replace-AsciiExact 'ExtremeCopy/App/UI/CptFileDialog.cpp' 'LONG g_lOriWndProc = NULL;' 'LONG_PTR g_lOriWndProc = 0;'
          Replace-AsciiExact 'ExtremeCopy/App/UI/CptFileDialog.cpp' 'return ((WNDPROC)g_lOriWndProc)( hwnd, uMsg, wParam ,lParam );' 'return ::CallWindowProc(reinterpret_cast<WNDPROC>(g_lOriWndProc), hwnd, uMsg, wParam, lParam);'
          Replace-AsciiExact 'ExtremeCopy/App/UI/CptFileDialog.cpp' 'g_lOriWndProc  = ::SetWindowLong( ::GetParent( hdlg ), GWLP_WNDPROC , (LONG)_WndProc );' 'g_lOriWndProc = ::SetWindowLongPtr(::GetParent(hdlg), GWLP_WNDPROC, reinterpret_cast<LONG_PTR>(_WndProc));'
          Replace-AsciiExact 'ExtremeCopy/App/UI/ptDialog.h' 'long SendMessage(UINT uMsg,WPARAM wParam,LPARAM lParam) ;' 'LRESULT SendMessage(UINT uMsg,WPARAM wParam,LPARAM lParam) ;'
          Replace-AsciiExact 'ExtremeCopy/App/UI/ptDialog.cpp' 'long CptDialog::SendMessage(UINT uMsg,WPARAM wParam,LPARAM lParam)' 'LRESULT CptDialog::SendMessage(UINT uMsg,WPARAM wParam,LPARAM lParam)'
          Replace-AsciiExact 'ExtremeCopy/App/UI/ptDialog.cpp' 'return (long)::SendMessage(m_hWnd,uMsg,wParam,lParam) ;' 'return ::SendMessage(m_hWnd,uMsg,wParam,lParam) ;'
          Replace-AsciiExact 'ExtremeCopy/App/UI/Hyperlink.cpp' '(HMENU)phs->ctlID' 'reinterpret_cast<HMENU>(static_cast<INT_PTR>(phs->ctlID))'
          Replace-AsciiExact 'ExtremeCopy/App/UI/ptWinToolTip.cpp' 'ti.uId    =(UINT)GetDlgItem(hWnd,id);' 'ti.uId    = reinterpret_cast<UINT_PTR>(GetDlgItem(hWnd,id));'
          Replace-AsciiExact 'ExtremeCopy/App/UI/ptWinToolTip.cpp' 'ti.uId    =(UINT)hControlWnd;' 'ti.uId    = reinterpret_cast<UINT_PTR>(hControlWnd);'
          Replace-AsciiExact 'ExtremeCopy/App/XCCopyTask.cpp' 'if((int)::ShellExecute(NULL,_T("runas"),_T("ExtremeCopy.exe"),strCmdLine.c_str(),strXCExeFileFolder.c_str(),SW_SHOW)>32)' 'if(reinterpret_cast<INT_PTR>(::ShellExecute(NULL,_T("runas"),_T("ExtremeCopy.exe"),strCmdLine.c_str(),strXCExeFileFolder.c_str(),SW_SHOW))>32)'
          Replace-AsciiExact 'ExtremeCopy/App/XCGlobal.cpp' 'EWebLink LinkType = (EWebLink)(int)pVoid ;' 'EWebLink LinkType = static_cast<EWebLink>(reinterpret_cast<INT_PTR>(pVoid)) ;'
          Replace-AsciiExact 'ExtremeCopy/App/XCGlobal.cpp' 'return ((int)::ShellExecute(NULL,_T("open"),pLink,NULL,NULL,SW_SHOWNORMAL)>32) ;' 'return (reinterpret_cast<INT_PTR>(::ShellExecute(NULL,_T("open"),pLink,NULL,NULL,SW_SHOWNORMAL))>32) ;'
          Replace-AsciiExact 'ExtremeCopy/App/XCNormalWndUIState.cpp' 'BOOL bCopyDone = (BOOL)pParam2 ;' 'BOOL bCopyDone = (pParam2 != NULL) ? TRUE : FALSE ;'
          Replace-AsciiExact 'ExtremeCopy/App/XCTransApp.cpp' 'm_FailedFileMsgQue.PostMsg((void*)(OldFfi.nIndex+1)) ;' 'm_FailedFileMsgQue.PostMsg(reinterpret_cast<void*>(static_cast<INT_PTR>(OldFfi.nIndex + 1))) ;'
          Replace-AsciiExact 'ExtremeCopy/App/XCTransApp.cpp' 'm_FailedFileMsgQue.RemoveMsg((void*)(OldFfi.nIndex+1)) ;' 'm_FailedFileMsgQue.RemoveMsg(reinterpret_cast<void*>(static_cast<INT_PTR>(OldFfi.nIndex + 1))) ;'
          Replace-AsciiExact 'ExtremeCopy/App/XCTransApp.cpp' 'int nIndex = (int)p - 1 ;' 'int nIndex = static_cast<int>(reinterpret_cast<INT_PTR>(p)) - 1 ;'
          Replace-AsciiExact 'ExtremeCopy/Core/XCFileDataBuffer.cpp' '::VirtualFree(m_pBlockBuf,m_nChunkSize,MEM_RELEASE) ;' '::VirtualFree(m_pBlockBuf,0,MEM_RELEASE) ;'

          git diff --check
          git diff --stat

      - name: Build patched x64 Release before commit
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal
          $exe = 'ExtremeCopy/App/Build/Release/ExtremeCopy.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }

      - name: Commit validated corrections
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ExtremeCopy/Common/WndShadow.h ExtremeCopy/Common/WndShadow.cpp ExtremeCopy/App/UI/CptFileDialog.cpp ExtremeCopy/App/UI/ptDialog.h ExtremeCopy/App/UI/ptDialog.cpp ExtremeCopy/App/UI/Hyperlink.cpp ExtremeCopy/App/UI/ptWinToolTip.cpp ExtremeCopy/App/XCCopyTask.cpp ExtremeCopy/App/XCGlobal.cpp ExtremeCopy/App/XCNormalWndUIState.cpp ExtremeCopy/App/XCTransApp.cpp ExtremeCopy/Core/XCFileDataBuffer.cpp
          git diff --cached --quiet && throw 'Expected corrections were not staged.'
          git commit -m 'fix: harden x64 pointer handling and buffer release'
          git push origin HEAD:main
