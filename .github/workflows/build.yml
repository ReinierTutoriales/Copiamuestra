name: Windows x64 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ExtremeCopy x64 Release
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal

      - name: Build x64 language resource DLLs
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          set "LANGOUT=%GITHUB_WORKSPACE%\ExtremeCopy\App\Build\x64\Release\Language"
          if not exist "%LANGOUT%" mkdir "%LANGOUT%"

          pushd "ExtremeCopy\App\Language\XCRes_ENU"
          rc /nologo /d _WIN64 /d _UNICODE /d UNICODE /fo XCRes_ENU.res XCRes_ENU.rc
          if errorlevel 1 exit /b 1
          link /nologo /dll /noentry /machine:x64 /out:"%LANGOUT%\XCRes_ENU.dll" XCRes_ENU.res
          if errorlevel 1 exit /b 1
          popd

          pushd "ExtremeCopy\App\Language\XCRes_ESP"
          rc /nologo /d _WIN64 /d _UNICODE /d UNICODE /fo XCRes_ESP.res XCRes_ESP.rc
          if errorlevel 1 exit /b 1
          link /nologo /dll /noentry /machine:x64 /out:"%LANGOUT%\XCRes_ESP.dll" XCRes_ESP.res
          if errorlevel 1 exit /b 1
          popd

      - name: Package release
        shell: pwsh
        run: |
          $exe = "ExtremeCopy/App/Build/Release/ExtremeCopy.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }

          $languageDir = "ExtremeCopy/App/Build/x64/Release/Language"
          $enu = Join-Path $languageDir "XCRes_ENU.dll"
          $esp = Join-Path $languageDir "XCRes_ESP.dll"
          if (-not (Test-Path $enu)) { throw "English resource DLL XCRes_ENU.dll was not produced" }
          if (-not (Test-Path $esp)) { throw "Spanish resource DLL XCRes_ESP.dll was not produced" }

          New-Item -ItemType Directory -Force -Path "dist/Language" | Out-Null
          Copy-Item $exe "dist/ExtremeCopy.exe"
          Copy-Item $enu "dist/Language/XCRes_ENU.dll"
          Copy-Item $esp "dist/Language/XCRes_ESP.dll"

          $required = @(
            "dist/ExtremeCopy.exe",
            "dist/Language/XCRes_ENU.dll",
            "dist/Language/XCRes_ESP.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required runtime file missing from package: $file" }
          }

          $required | ForEach-Object {
            $hash = Get-FileHash $_ -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Substring(5).Replace('\\','/'))"
          } | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

          Compress-Archive -Path "dist/*" -DestinationPath "ExtremeCopy-x64.zip" -Force
          Get-ChildItem "dist" -Recurse | Select-Object FullName, Length, LastWriteTime
          Get-Item "ExtremeCopy-x64.zip" | Select-Object FullName, Length, LastWriteTime

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ExtremeCopy-x64-Release
          path: ExtremeCopy-x64.zip
          if-no-files-found: error
          retention-days: 30
