name: Windows x64 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize active source encodings
        shell: pwsh
        run: ./.github/scripts/normalize-active-sources.ps1

      - name: Apply final correctness patch
        if: github.event.head_commit.message == 'ci: apply final correctness integration'
        shell: pwsh
        run: ./.github/scripts/finalize-correctness.ps1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ExtremeCopy x64 Release
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "ExtremeCopy/App/Build/Release/ExtremeCopy.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime

      - name: Commit final correctness patch
        if: github.event.head_commit.message == 'ci: apply final correctness integration'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExtremeCopy/Core/XCDestinationFilter.cpp ExtremeCopy/App/XCConfiguration.cpp
          git diff --cached --check
          git commit -m "fix: finalize destination correctness and 64-bit state"
          git push origin HEAD:main
