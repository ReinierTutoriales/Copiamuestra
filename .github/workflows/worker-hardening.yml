name: Async worker hardening

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/worker-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Patch exact source bytes
        shell: pwsh
        run: |
          $enc=[Text.Encoding]::GetEncoding(28591)
          function Replace-One($path,$old,$new) {
            $text=$enc.GetString([IO.File]::ReadAllBytes($path))
            $nl=if($text.Contains("`r`n")){"`r`n"}else{"`n"}
            $old=$old.Replace("`n",$nl); $new=$new.Replace("`n",$nl)
            $count=([regex]::Matches($text,[regex]::Escape($old))).Count
            if($count -ne 1){throw "$path expected one match, found $count"}
            [IO.File]::WriteAllBytes($path,$enc.GetBytes($text.Replace($old,$new)))
          }
          $h='ExtremeCopy/Core/XCAsyncFileDataTransFilter.h'
          $cpp='ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp'
          Replace-One $h '#include <set>' "#include <set>`n#include <atomic>"
          Replace-One $h "`tbool`t`t`t`t`t`t`tm_bWriteThreadEnd;" "`tstd::atomic<bool>`t`t`t`t`tm_bWriteThreadEnd;"
          $old=@'
	if(m_hWriteDataReadyEvent==NULL)
	{
		m_hWriteDataReadyEvent = ::CreateEvent(NULL,FALSE,FALSE,NULL) ;
	}

	if(m_hThread==NULL)
	{
		m_bWriteThreadEnd = false;
		m_hThread = (HANDLE)::_beginthreadex(NULL,0,ThreadFunc,this,0,NULL) ;
	}

	return CXCFileDataCacheTransFilter::OnInitialize() ;
'@
          $new=@'
	if(m_hWriteDataReadyEvent==NULL)
	{
		m_hWriteDataReadyEvent = ::CreateEvent(NULL,FALSE,FALSE,NULL) ;
		if(m_hWriteDataReadyEvent==NULL)
			return false ;
	}

	if(m_hThread==NULL)
	{
		m_bWriteThreadEnd.store(false,std::memory_order_release) ;
		m_hThread = (HANDLE)::_beginthreadex(NULL,0,ThreadFunc,this,0,NULL) ;
		if(m_hThread==NULL)
		{
			m_bWriteThreadEnd.store(true,std::memory_order_release) ;
			::CloseHandle(m_hWriteDataReadyEvent) ;
			m_hWriteDataReadyEvent = NULL ;
			return false ;
		}
	}

	if(!CXCFileDataCacheTransFilter::OnInitialize())
	{
		m_bWriteThreadEnd.store(true,std::memory_order_release) ;
		::SetEvent(m_hWriteDataReadyEvent) ;
		::WaitForSingleObject(m_hThread,INFINITE) ;
		::CloseHandle(m_hThread) ;
		m_hThread = NULL ;
		::CloseHandle(m_hWriteDataReadyEvent) ;
		m_hWriteDataReadyEvent = NULL ;
		return false ;
	}

	return true ;
'@
          Replace-One $cpp $old $new
          $text=$enc.GetString([IO.File]::ReadAllBytes($cpp))
          $text=$text.Replace('m_bWriteThreadEnd = true;','m_bWriteThreadEnd.store(true,std::memory_order_release) ;')
          $text=$text.Replace('m_bWriteThreadEnd = false;','m_bWriteThreadEnd.store(false,std::memory_order_release) ;')
          $text=$text.Replace('PT_BREAK_IF(m_bWriteThreadEnd);','PT_BREAK_IF(m_bWriteThreadEnd.load(std::memory_order_acquire));')
          $text=$text.Replace('m_bWriteThreadEnd ||','m_bWriteThreadEnd.load(std::memory_order_acquire) ||')
          $text=$text.Replace('!m_bWriteThreadEnd ||','!m_bWriteThreadEnd.load(std::memory_order_acquire) ||')
          [IO.File]::WriteAllBytes($cpp,$enc.GetBytes($text))
          git diff --check
          $changed=@(git diff --name-only)
          $expected=@($h,$cpp)
          if($changed.Count -ne 2 -or ($changed | Where-Object {$_ -notin $expected})){throw "Unexpected files: $changed"}
          git diff --numstat -- $h $cpp
          git diff -- $h $cpp
      - name: Build x64 Release
        shell: pwsh
        run: |
          msbuild ExtremeCopy/App/ExtremeCopy64.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:PostBuildEventUseInBuild=false /verbosity:minimal
          if(-not (Test-Path 'ExtremeCopy/App/Build/Release/ExtremeCopy.exe')){throw 'Executable missing'}
      - name: Commit validated hardening
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ExtremeCopy/Core/XCAsyncFileDataTransFilter.cpp ExtremeCopy/Core/XCAsyncFileDataTransFilter.h
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'No source changes staged'}
          git commit -m 'fix: harden async worker initialization and stop flag'
          git push origin HEAD:main
